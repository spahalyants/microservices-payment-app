name: Build Project for PR

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compile with Maven
        run: mvn -B -ntp clean compile

      - name: Run tests
        run: mvn -B -ntp test

      - name: Run Checkstyle
        run: mvn -B -ntp checkstyle:check

      - name: Run Checkstyle (payment-service-app)
        working-directory: ./payment-service-app
        run: mvn -B -ntp checkstyle:check
