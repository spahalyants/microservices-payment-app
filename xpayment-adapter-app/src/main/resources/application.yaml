server:
  port: 8082

spring:
  application:
    name: x-payment-adapter-app

  kafka:
    bootstrap-servers: localhost:9093
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: xpayment-adapter-consumers
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.use.type.headers: false
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: "com.iprody.xpaymentadapterapp.async.XPaymentAdapterRequestMessage"
    listener:
      ack-mode: manual
      concurrency: 1
      observation-enabled: true
    template:
      observation-enabled: true
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin

logging:
  level:
    com.iprody.xpayment: DEBUG
    org.springframework.kafka: INFO

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c,b3
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans

app:
  kafka:
    topics:
      x-payment-adapter:
        request: xpayment-adapter.requests
        response: xpayment-adapter.responses
        dlt: xpayment-adapter.requests.DLT

  rabbitmq:
    exchange-name: payment-state-check-exchange
    queue-name: payment-state-check-queue
    dlx-exchange-name: payments.dlx
    dlx-routing-key: payments.dead
    max-attempts: 60
    interval-ms: 60000

  x-payment-provider-api:
    client:
      url: http://localhost:9999
      username: paymentAgentIprody
      password: iprodyTestPassword0123
      account: paymentAgentIprodyApiToken
