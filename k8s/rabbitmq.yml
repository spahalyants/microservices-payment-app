apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: rabbit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: admin
            - name: RABBITMQ_DEFAULT_PASS
              value: admin
          volumeMounts:
            - name: rabbitmq-plugins
              mountPath: /etc/rabbitmq/enabled_plugins
              subPath: enabled_plugins
      volumes:
        - name: rabbitmq-plugins
          configMap:
            name: rabbitmq-plugins
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-plugins
  namespace: rabbit
data:
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_delayed_message_exchange].
---
apiVersion: v1
kind: Service
metadata:
  name: my-rabbit-rabbitmq
  namespace: rabbit
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
